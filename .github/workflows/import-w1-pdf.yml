name: Import verified W1 PDF
on:
  push:
    paths:
      - ".github/workflows/import-w1-pdf.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-w1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch exact published W1 edition
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          record_url = "https://zenodo.org/api/records/23359788"
          expected = "cadd4f05d3217ae032f0f0baa6aae6beae491237b2b5f39edb74e5f66d4a18a0"
          def retrieve(url, accept):
              req = urllib.request.Request(url, headers={"User-Agent": "Zawwar-Research-Archive/1.0", "Accept": accept})
              with urllib.request.urlopen(req, timeout=90) as response:
                  return response.read()
          record = json.loads(retrieve(record_url, "application/json"))
          matches = [f for f in record.get("files", []) if f.get("key", "").lower().endswith(".pdf")]
          for f in matches:
              url = f.get("links", {}).get("content") or f.get("links", {}).get("self")
              if not url:
                  continue
              pdf = retrieve(url, "application/pdf")
              digest = hashlib.sha256(pdf).hexdigest()
              if digest != expected:
                  continue
              target = pathlib.Path("W/W1/Zawwar-Sami-Weapons-as-Systems-W1.pdf")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(pdf)
              print(target, len(pdf), digest)
              break
          else:
              raise RuntimeError("No Zenodo W1 PDF matches the author-verified SHA256; refused to publish.")
          PY
      - name: Commit unchanged manuscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add W/W1/Zawwar-Sami-Weapons-as-Systems-W1.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add author-verified W1 full manuscript PDF"
          git push
