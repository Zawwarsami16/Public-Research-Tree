name: Import verified W1 PDF
on:
  push:
    paths:
      - ".github/workflows/import-w1-pdf.yml"
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: write
jobs:
  import-w1:
    if: github.event_name != 'issue_comment' || (github.event.issue.number == 11 && contains(github.event.comment.body, 'IMPORT_W1_VERIFIED_PDF'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch exact published W1 edition
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request, urllib.parse, urllib.error
          record_id = "23359788"
          expected = "cadd4f05d3217ae032f0f0baa6aae6beae491237b2b5f39edb74e5f66d4a18a0"
          record_url = f"https://zenodo.org/api/records/{record_id}"
          def retrieve(url):
              headers = {
                  "User-Agent": "Mozilla/5.0 (compatible; ResearchArchive/1.0)",
                  "Accept": "*/*",
                  "Referer": f"https://zenodo.org/records/{record_id}",
              }
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.read()
          record = json.loads(retrieve(record_url))
          candidates = [f for f in record.get("files", []) if f.get("key","").lower().endswith(".pdf")]
          if not candidates:
              raise RuntimeError("Zenodo metadata does not list a PDF")
          found = None
          for entry in candidates:
              key = entry.get("key","")
              encoded = urllib.parse.quote(key, safe="")
              links = entry.get("links",{})
              urls = [
                  links.get("content"),
                  links.get("self"),
                  f"https://zenodo.org/records/{record_id}/files/{encoded}?download=1",
                  f"https://zenodo.org/api/records/{record_id}/files/{encoded}/content",
              ]
              for url in dict.fromkeys(u for u in urls if u):
                  try:
                      binary = retrieve(url)
                      digest = hashlib.sha256(binary).hexdigest()
                      print("W1 candidate", url, "size",len(binary),"SHA256",digest, flush=True)
                      if digest == expected:
                          found = binary
                          break
                  except Exception as exc:
                      print("Download attempt failed",url,repr(exc),flush=True)
              if found is not None:
                  break
          if found is None:
              raise RuntimeError("Could not obtain author-verified W1 manuscript from Zenodo (checked all download routes)")
          target = pathlib.Path("W/W1/Zawwar-Sami-Weapons-as-Systems-W1.pdf")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(found)
          print("Verified W1 PDF copied",target,len(found),expected)
          PY
      - name: Commit unchanged manuscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add W/W1/Zawwar-Sami-Weapons-as-Systems-W1.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add author-verified W1 full manuscript PDF"
          git push
